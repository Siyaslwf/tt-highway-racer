project:
  title: "Retro Highway Racer"
  author: "SIYAS"
  discord: ""
  description: "Arcade highway racing game with dynamic car/bike transformation, scrolling traffic, and collision scoring on 640x480 VGA"
  language: "Verilog"
  clock_hz: 25175000 # 25.175 MHz standard VGA pixel clock

  # How many tiles your design occupies
  tiles: "1x1"

  # Top module name
  top_module: "tt_um_vga_example"

  # Pinout
  pinout:
    # Inputs
    ui[0]: "Gas / Turbo"
    ui[1]: "Brake"
    ui[2]: "Steer Left"
    ui[3]: "Steer Right"
    ui[4]: "Unused"
    ui[5]: "Unused"
    ui[6]: "Unused"
    ui[7]: "Transform Car/Bike"

    # Outputs (TinyVGA standard pinout)
    uo[0]: "R1"
    uo[1]: "G1"
    uo[2]: "B1"
    uo[3]: "vsync"
    uo[4]: "R0"
    uo[5]: "G0"
    uo[6]: "B0"
    uo[7]: "hsync"

    # Bidirectional pins (unused)
    uio[0]: "None"
    uio[1]: "None"
    uio[2]: "None"
    uio[3]: "None"
    uio[4]: "None"
    uio[5]: "None"
    uio[6]: "None"
    uio[7]: "None"
